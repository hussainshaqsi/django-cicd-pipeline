stages: [test, deploy]

test:
  stage: test
  tags: [oracle]
  script:
    - docker compose build

deploy:
  stage: deploy
  tags: [oracle]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - echo "DJANGO_SECRET_KEY=$DJANGO_SECRET_KEY" > .env
    - docker compose up -d --build
    - docker image prune -f